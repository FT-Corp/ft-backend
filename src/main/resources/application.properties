# AWS S3
cloud.aws.credentials.access-key=${aws.s3.accessKey}
cloud.aws.credentials.secret-key=${aws.s3.secretKey}
cloud.aws.region.static=${aws.s3.region}
cloud.aws.stack.auto=false
cloud.aws.s3.bucket=${aws.s3.bucket}
